<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CaptionAI</title>
    <meta name="description" content="CaptionAI - Generate engaging LinkedIn posts with AI. Login to get started.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <!-- Floating Particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="icon-box">
                <i class="fa-solid fa-robot"></i>
            </div>
            <h1>CaptionAI</h1>
            <p>Generate engaging LinkedIn posts with AI</p>
        </div>
        
        <form action="/dashboard" method="GET" class="login-form">
            <div class="form-group">
                <label for="email">Email / Username</label>
                <input type="text" id="email" placeholder="student@example.com" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <div class="login-extras">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn-primary" style="width:100%;">
                <span>Login</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="login-footer">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>
</body>
</html>
